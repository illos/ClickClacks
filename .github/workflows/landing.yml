name: Publish Click Clacks landing
on:
  push:
    branches: [main]
    paths:
      - landing.html
      - web/landing/**
      - web/branding/**
      - web/dice-demo/**
      - web/dice-demo-v2/**
      - web/popout-demo/tray.css
      - lib/**
      - shared/**
      - vite.landing.config.ts
      - wrangler.landing.jsonc
      - scripts/build-landing.mjs
      - scripts/lib/dice-font-build.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/landing.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clickclacks-landing-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:landing
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      - run: pnpm dlx wrangler@4.134.0 deploy --config wrangler.landing.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#111415" />
    <link rel="icon" type="image/svg+xml" href="../branding/click-clacks-mark.svg" />
    <script>
      // Apply the saved/device appearance before the app bundle paints.
      let choice = 'system';
      try {
        const saved = JSON.parse(localStorage.getItem('powerroller.preferences.v2') || 'null');
        if (saved?.version === 2) choice = saved.preferences?.theme;
      } catch { /* Device appearance still works when storage is blocked. */ }
      const theme = choice === 'light' || choice === 'dark' ? choice : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f4f1eb' : '#111415';
    </script>
    <title>Click Clacks tray</title>
    <style>
      :root { background: #111415; color: #e8e5df; }
      :root[data-theme='light'] { background: #f4f1eb; color: #202a2c; }
      body { margin: 0; background: inherit; color: inherit; font-family: system-ui, sans-serif; }
      #boot-message { padding: 24px; font-size: 14px; }
      #boot-message[hidden] { display: none; }
    </style>
  </head>
  <body class="mini-tray">
    <p id="boot-message" role="status">Loading dice tray…</p>
    <div id="root" data-tray-history="true" data-popout="true"></div>
    <script type="module" src="../popout-demo/tray.ts"></script>
  </body>
</html>
